# Week-1 pilot: `full` arm only, measure permutation SD.
# This config exists to answer one question: is the premise alive?
# Kill criterion: median within-query SD of token-F1 across permutations < 0.02.
name: pilot_w1

data:
  dataset: hotpotqa_distractor
  split: validation
  n_queries: 100
  seed: 20260828
  stratify_by: hop_type
  memorization_filter: false   # week 1 measures raw variance; filter lands week 3

generator:
  backend: local
  model: Qwen/Qwen2.5-3B-Instruct
  quantization: 4bit
  max_new_tokens: 32
  # 6.4 GB VRAM, and the laptop display runs off the same GPU. The monitor
  # blanking during runs was Windows TDR resetting the display driver, not an
  # OOM; TdrDelay is now raised to 10s machine-wide, which fixed it at the root.
  #
  # Re-benchmarked on 8 real prompts (median 1,520 tokens) after that change:
  #
  #     batch 1   1.08 s/gen   peak 2.66 GB
  #     batch 2   0.82 s/gen   peak 2.50 GB
  #     batch 4   0.78 s/gen   peak 2.91 GB   <- chosen
  #     batch 8   0.72 s/gen   peak 3.75 GB
  #
  # Batching buys much less than expected -- 1.5x from 1 to 8, and almost all of
  # it by batch 2. Batch 4 takes ~92% of the available speedup for 0.84 GB less
  # peak than batch 8, so it is the better trade on a GPU that also drives the
  # screen. (The old note here claimed batch 8 would OOM. It does not.)
  batch_size: 4
  # Small pause is cheap insurance for the compositor now that TDR is the real
  # fix rather than the workaround: ~3% of runtime at batch 4.
  batch_pause_s: 0.1
  # Hard ceiling, so overrunning is a clean CUDA OOM rather than a display
  # crash. 0.7 = 4.5 GB, comfortably above the 2.91 GB peak measured above.
  max_vram_fraction: 0.7
  # Greedy everywhere. Sampling would confound sampling noise with
  # permutation noise and collapse the whole design (plan Sec. 4.2).
  temperature: 0.0
  do_sample: false
  seed: 20260828

arms: [full]
budgets: [10]

permutation:
  n_permutations: 5
  strategies: [rank, reverse, random, random, random]
  seed: 20260828

cache:
  backend: sqlite
  path: cache/generations.sqlite

output:
  results_dir: results/pilot_w1
