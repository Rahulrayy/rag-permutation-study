# Main run: 300 queries x 8 arms x 3 budgets x 5 permutations = 36,000 generations.
# Do not run before ANALYSIS_PLAN.md is filled in and committed.
name: main_hotpotqa

data:
  dataset: hotpotqa_distractor
  split: validation
  n_queries: 300
  seed: 20260828
  stratify_by: hop_type
  memorization_filter: true    # restrict primary analysis to nocontext-incorrect

generator:
  backend: local
  model: Qwen/Qwen2.5-3B-Instruct
  quantization: 4bit
  max_new_tokens: 32
  temperature: 0.0
  do_sample: false
  seed: 20260828
  # 6.4 GB VRAM: batch 5 already reached 5.9 GB in the smoke test.
  batch_size: 4

arms:
  - full
  - nocontext
  - rerank_topk
  - provence
  - llmlingua2
  - llm_pruner
  - random_drop
  - placebo_pos
  - loo_oracle

budgets: [2, 3, 5]

arm_params:
  rerank_topk:
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
  placebo_pos:
    # The novel control: drop by position, not content, at matched keep-count.
    strategies: [middle_first, edges_first, tail_first]
  random_drop:
    seed: 20260828
  llm_pruner:
    max_new_tokens: 64

permutation:
  n_permutations: 5
  strategies: [rank, reverse, random, random, random]
  seed: 20260828

metrics:
  baseline_arm: rerank_topk     # denominator arm for OAE
  placebo_arm: placebo_pos
  oracle_arm: loo_oracle

stats:
  bootstrap_replicates: 10000
  ci: 0.95
  correction: holm
  seed: 20260828

cache:
  backend: sqlite
  path: cache/generations.sqlite

output:
  results_dir: results/main_hotpotqa
