# Main run: 300 queries x 8 arms x 3 budgets x 5 permutations = 36,000 generations.
# Do not run before ANALYSIS_PLAN.md is filled in and committed.
name: main_hotpotqa

data:
  dataset: hotpotqa_distractor
  split: validation
  n_queries: 300
  seed: 20260828
  stratify_by: hop_type
  memorization_filter: true    # restrict primary analysis to nocontext-incorrect

generator:
  backend: local
  model: Qwen/Qwen2.5-3B-Instruct
  quantization: 4bit
  max_new_tokens: 32
  temperature: 0.0
  do_sample: false
  seed: 20260828
  # 6.4 GB VRAM, and the laptop display runs off the same GPU. The monitor
  # blanking during runs was Windows TDR resetting the display driver, not an
  # OOM; TdrDelay is now raised to 10s machine-wide, which fixed it at the root.
  #
  # Re-benchmarked on 8 real prompts (median 1,520 tokens) after that change:
  #
  #     batch 1   1.08 s/gen   peak 2.66 GB
  #     batch 2   0.82 s/gen   peak 2.50 GB
  #     batch 4   0.78 s/gen   peak 2.91 GB   <- chosen
  #     batch 8   0.72 s/gen   peak 3.75 GB
  #
  # Batching buys much less than expected -- 1.5x from 1 to 8, and almost all of
  # it by batch 2. Batch 4 takes ~92% of the available speedup for 0.84 GB less
  # peak than batch 8, so it is the better trade on a GPU that also drives the
  # screen. (The old note here claimed batch 8 would OOM. It does not.)
  batch_size: 4
  # Small pause is cheap insurance for the compositor now that TDR is the real
  # fix rather than the workaround: ~3% of runtime at batch 4.
  batch_pause_s: 0.1
  # Hard ceiling, so overrunning is a clean CUDA OOM rather than a display
  # crash. 0.7 = 4.5 GB, comfortably above the 2.91 GB peak measured above.
  max_vram_fraction: 0.7

arms:
  - full
  - nocontext
  - rerank_topk
  # Provence is two methods in one: an excellent reranker and a brutal
  # sentence pruner. Run separately so their difference isolates the
  # pruning contribution with selection held fixed. See src/prune/provence.py.
  - provence_rerank
  - provence_full
  - llmlingua2
  - llm_pruner
  - random_drop
  - placebo_pos
  - loo_oracle

budgets: [2, 3, 5]

arm_params:
  rerank_topk:
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
  provence_rerank:
    threshold: 0.1
  provence_full:
    threshold: 0.1
  # placebo_pos takes no arm_params: the runner expands the bare name into
  # placebo_pos:middle_first / :edges_first / :tail_first, one arm each, and
  # each appears under its own name in generations.csv. To run a single variant,
  # write it out in `arms` above instead of the bare name.
  random_drop:
    seed: 20260828
  llm_pruner:
    max_new_tokens: 64
  llmlingua2:
    # bert-base rather than xlm-roberta-large: 0.71 GB against 2.2 on a 6 GB
    # card. A deviation from the paper's headline model; state it in the write-up.
    model: microsoft/llmlingua-2-bert-base-multilingual-cased-meetingbank

permutation:
  n_permutations: 5
  strategies: [rank, reverse, random, random, random]
  seed: 20260828

metrics:
  baseline_arm: rerank_topk     # denominator arm for OAE
  # OPEN (HANDOFF Sec. 8): all three placebo variants run, but only one can be
  # the confirmatory comparator for H4. middle_first is the default because it
  # is the shape a lost-in-the-middle-aware pruner produces by accident, which
  # is the specific confound RQ4 is aimed at. Confirm or change this in
  # ANALYSIS_PLAN.md before the main run; the other two are then exploratory.
  placebo_arm: placebo_pos:middle_first
  oracle_arm: loo_oracle

stats:
  bootstrap_replicates: 10000
  ci: 0.95
  correction: holm
  seed: 20260828

cache:
  backend: sqlite
  path: cache/generations.sqlite

output:
  results_dir: results/main_hotpotqa
