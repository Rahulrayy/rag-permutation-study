# Main run: 300 queries x 8 arms x 3 budgets x 5 permutations = 36,000 generations.
# Do not run before ANALYSIS_PLAN.md is filled in and committed.
name: main_hotpotqa

data:
  dataset: hotpotqa_distractor
  split: validation
  n_queries: 300
  seed: 20260828
  stratify_by: hop_type
  memorization_filter: true    # restrict primary analysis to nocontext-incorrect

generator:
  backend: local
  model: Qwen/Qwen2.5-3B-Instruct
  quantization: 4bit
  max_new_tokens: 32
  temperature: 0.0
  do_sample: false
  seed: 20260828
  # 6.4 GB VRAM, and the laptop display runs off the same GPU. This machine is
  # display-limited, not OOM-limited: batch 5 reached 5.9 GB in the smoke test,
  # but batch 4 and then batch 2 both blanked the monitor long before that.
  # Windows TDR is at its 2s default, so a kernel that holds the GPU too long
  # gets the display driver reset out from under it -- a latency problem as much
  # as a memory one.
  #
  # Batch 1 keeps each kernel short; the pause hands the GPU back to the
  # compositor between batches. Both cost only wall-clock. Roughly 3-4x slower
  # than batch 4, which is a trade worth making for a machine you also have to
  # look at.
  batch_size: 1
  batch_pause_s: 0.25
  # Hard ceiling, so overrunning is a clean CUDA OOM rather than a display
  # crash. The cache keeps whatever was already generated, so a restart at a
  # smaller batch resumes instead of starting over.
  max_vram_fraction: 0.5

arms:
  - full
  - nocontext
  - rerank_topk
  - provence
  - llmlingua2
  - llm_pruner
  - random_drop
  - placebo_pos
  - loo_oracle

budgets: [2, 3, 5]

arm_params:
  rerank_topk:
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
  # placebo_pos takes no arm_params: the runner expands the bare name into
  # placebo_pos:middle_first / :edges_first / :tail_first, one arm each, and
  # each appears under its own name in generations.csv. To run a single variant,
  # write it out in `arms` above instead of the bare name.
  random_drop:
    seed: 20260828
  llm_pruner:
    max_new_tokens: 64

permutation:
  n_permutations: 5
  strategies: [rank, reverse, random, random, random]
  seed: 20260828

metrics:
  baseline_arm: rerank_topk     # denominator arm for OAE
  # OPEN (HANDOFF Sec. 8): all three placebo variants run, but only one can be
  # the confirmatory comparator for H4. middle_first is the default because it
  # is the shape a lost-in-the-middle-aware pruner produces by accident, which
  # is the specific confound RQ4 is aimed at. Confirm or change this in
  # ANALYSIS_PLAN.md before the main run; the other two are then exploratory.
  placebo_arm: placebo_pos:middle_first
  oracle_arm: loo_oracle

stats:
  bootstrap_replicates: 10000
  ci: 0.95
  correction: holm
  seed: 20260828

cache:
  backend: sqlite
  path: cache/generations.sqlite

output:
  results_dir: results/main_hotpotqa
